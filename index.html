<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark">
  <title>SQL-Spielplatz – SQL ausprobieren im Browser</title>
  <meta name="description" content="SQL lernen und ausprobieren an einer echten SQLite-Datenbank, direkt im Browser. Mit Beispieltabellen, Spickzettel und fertigen Beispielen.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%23a78bfa'/%3E%3Cstop offset='1' stop-color='%2322d3ee'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cg fill='none' stroke='%230b0c12' stroke-width='2.4'%3E%3Cellipse cx='16' cy='10' rx='7' ry='3'/%3E%3Cpath d='M9 10v12c0 1.7 3.1 3 7 3s7-1.3 7-3V10M9 16c0 1.7 3.1 3 7 3s7-1.3 7-3'/%3E%3C/g%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>
  <!-- Icons: einmal definiert, überall mit <use href="#i-…"> benutzt -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <linearGradient id="verlauf-marke" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a78bfa"/>
        <stop offset="1" stop-color="#22d3ee"/>
      </linearGradient>
    </defs>
    <symbol id="i-db" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><ellipse cx="12" cy="5.5" rx="7.5" ry="3"/><path d="M4.5 5.5v13c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3v-13"/><path d="M4.5 12c0 1.7 3.4 3 7.5 3s7.5-1.3 7.5-3"/></g></symbol>
    <symbol id="i-start" viewBox="0 0 24 24"><path d="M7.5 4.8v14.4a1 1 0 0 0 1.5.86l11.3-7.2a1 1 0 0 0 0-1.72L9 3.94a1 1 0 0 0-1.5.86z" fill="currentColor"/></symbol>
    <symbol id="i-zurueck" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 12a8.5 8.5 0 1 0 2.6-6.1"/><path d="M3.5 4v5h5"/></g></symbol>
    <symbol id="i-kopieren" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="9" y="9" width="11.5" height="11.5" rx="2.5"/><path d="M5.5 15H5a1.5 1.5 0 0 1-1.5-1.5V5A1.5 1.5 0 0 1 5 3.5h8.5A1.5 1.5 0 0 1 15 5v.5"/></g></symbol>
    <symbol id="i-suche" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.2-4.2"/></g></symbol>
    <symbol id="i-tabelle" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M9.5 10v9.5"/></g></symbol>
    <symbol id="i-schluessel" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="8" cy="15" r="4"/><path d="m11 12 8.5-8.5M16.5 6.5l2.5 2.5M14 9l2 2"/></g></symbol>
    <symbol id="i-pfeil" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6.5l5.5 5.5-5.5 5.5"/></g></symbol>
    <symbol id="i-haken" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-warnung" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M10.3 4.2 2.8 17.5A2 2 0 0 0 4.5 20.5h15a2 2 0 0 0 1.7-3L13.7 4.2a2 2 0 0 0-3.4 0z" stroke-linejoin="round"/><path d="M12 9.5v4M12 17h.01"/></g></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v5M12 8h.01"/></g></symbol>
    <symbol id="i-einfuegen" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17.5 9.5 12 4 6.5M12 18h8"/></g></symbol>
    <symbol id="i-buch" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5.5A2 2 0 0 1 6 3.5h13.5v14H6a2 2 0 0 0-2 2z"/><path d="M4 19.5a2 2 0 0 0 2 2h13.5v-4"/></g></symbol>
    <symbol id="i-funke" viewBox="0 0 24 24"><path d="M12 3c.6 4.2 2.6 6.4 7 7-4.4.6-6.4 2.8-7 7-.6-4.2-2.6-6.4-7-7 4.4-.6 6.4-2.8 7-7z" fill="currentColor"/></symbol>
    <symbol id="i-runter" viewBox="0 0 24 24"><path d="m6.5 9.5 5.5 5.5 5.5-5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></symbol>
    <symbol id="i-links" viewBox="0 0 24 24"><path d="M19 12H6M11 6.5 5.5 12l5.5 5.5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-uhr" viewBox="0 0 24 24"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></g></symbol>
  </svg>

  <header class="kopf">
    <div class="marke">
      <span class="marke__logo"><svg class="ic" aria-hidden="true"><use href="#i-db"/></svg></span>
      <div>
        <h1 class="marke__name">SQL-Spielplatz</h1>
        <p class="marke__unter">Echtes SQLite, direkt in deinem Browser</p>
      </div>
    </div>
    <div class="kopf__rechts">
      <span class="status" id="status" role="status">
        <span class="status__punkt" aria-hidden="true"></span>
        <span id="status-text">Startet …</span>
      </span>
      <button class="knopf knopf--leise" id="zuruecksetzen" type="button" title="Alle Änderungen verwerfen und die Beispieldaten neu laden">
        <svg class="ic" aria-hidden="true"><use href="#i-zurueck"/></svg>
        <span>Zurücksetzen</span>
      </button>
    </div>
  </header>

  <main class="flaeche">
    <!-- Links: Nachschlagen (Tabellen, Spickzettel, Beispiele) -->
    <aside class="seitenleiste" aria-label="Nachschlagen">
      <div class="panel panel--hoch">
        <div class="panel__kopf panel__kopf--reiter">
          <div class="reiter reiter--voll" role="tablist" aria-label="Nachschlagen">
            <button class="reiter__knopf" role="tab" type="button" id="reiter-tabellen" aria-controls="seite-tabellen"
                    data-reiter="tabellen" aria-selected="true">
              <svg class="ic" aria-hidden="true"><use href="#i-tabelle"/></svg> Tabellen</button>
            <button class="reiter__knopf" role="tab" type="button" id="reiter-spickzettel" aria-controls="seite-spickzettel"
                    data-reiter="spickzettel" aria-selected="false" tabindex="-1">
              <svg class="ic" aria-hidden="true"><use href="#i-buch"/></svg> Spickzettel</button>
            <button class="reiter__knopf" role="tab" type="button" id="reiter-beispiele" aria-controls="seite-beispiele"
                    data-reiter="beispiele" aria-selected="false" tabindex="-1">
              <svg class="ic" aria-hidden="true"><use href="#i-funke"/></svg> Beispiele</button>
          </div>
        </div>

        <div class="panel__inhalt" id="seite-tabellen" role="tabpanel" aria-labelledby="reiter-tabellen">
          <div id="tabellen-liste" class="tabellen-liste"></div>
          <button type="button" class="anleitung-knopf" data-anleitung-oeffnen>
            <span class="anleitung-knopf__icon"><svg class="ic" aria-hidden="true"><use href="#i-plus"/></svg></span>
            <span><strong>Eigene Tabelle anlegen</strong><span>Schritt für Schritt erklärt</span></span>
            <svg class="ic" aria-hidden="true"><use href="#i-pfeil"/></svg>
          </button>
        </div>

        <div class="panel__inhalt" id="seite-spickzettel" role="tabpanel" aria-labelledby="reiter-spickzettel" hidden>
          <label class="suche">
            <svg class="ic" aria-hidden="true"><use href="#i-suche"/></svg>
            <input type="search" id="suche" placeholder="Befehl suchen, z. B. JOIN oder sortieren" aria-label="Spickzettel durchsuchen">
          </label>
          <div class="reihenfolge-box">
            <h3 class="mini-titel">Reihenfolge einer Abfrage</h3>
            <div class="reihenfolge" id="reihenfolge"></div>
          </div>
          <div class="spick-leiste">
            <span class="leise klein" id="spick-anzahl"></span>
            <button type="button" class="knopf knopf--klein knopf--geist" id="alle-aufklappen">Alle aufklappen</button>
          </div>
          <div id="begriffe"></div>
        </div>

        <div class="panel__inhalt" id="seite-beispiele" role="tabpanel" aria-labelledby="reiter-beispiele" hidden>
          <div id="beispiele" class="beispiele"></div>
        </div>
      </div>
    </aside>

    <!-- Rechts: Arbeiten (Editor und Anzeige) -->
    <section class="arbeitsbereich" aria-label="Abfrage und Ergebnis">
      <div class="panel editor-panel" id="editor-panel">
        <div class="panel__kopf">
          <div class="datei"><span class="datei__punkt" aria-hidden="true"></span>abfrage.sql</div>
          <div class="kopf-aktionen">
            <div class="verlauf-menue">
              <button class="knopf knopf--klein knopf--geist" id="verlauf-knopf" type="button" aria-expanded="false" aria-controls="verlauf-popup">
                <svg class="ic" aria-hidden="true"><use href="#i-uhr"/></svg> <span class="verlauf-text">Verlauf</span> <span class="zaehler" id="verlauf-zahl">0</span>
              </button>
              <div class="verlauf-popup" id="verlauf-popup" hidden>
                <div class="verlauf-kopf">
                  <span class="mini-titel">Deine letzten Abfragen</span>
                  <button type="button" class="knopf knopf--klein knopf--geist" id="verlauf-leeren">Leeren</button>
                </div>
                <ul id="verlauf" class="verlauf"></ul>
              </div>
            </div>
            <span class="tasten leise" aria-hidden="true"><kbd>Strg</kbd><kbd>Enter</kbd></span>
            <button class="knopf knopf--start" id="ausfuehren" type="button">
              <svg class="ic" aria-hidden="true"><use href="#i-start"/></svg>
              Ausführen
            </button>
          </div>
        </div>
        <div class="editor" id="editor">
          <div class="editor__rand" aria-hidden="true"><div class="editor__zeilen"></div></div>
          <div class="editor__flaeche">
            <pre class="editor__farbe" aria-hidden="true"><code></code></pre>
            <textarea id="sql" wrap="off" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off"
                      aria-label="SQL-Abfrage" aria-autocomplete="list" aria-controls="vorschlaege" aria-expanded="false"></textarea>
          </div>
          <ul class="vorschlaege" id="vorschlaege" role="listbox" aria-label="Vorschläge" hidden></ul>
        </div>
      </div>

      <div class="panel anzeige-panel">
        <div class="panel__kopf" id="anzeige-kopf"></div>
        <div class="panel__inhalt anzeige" id="anzeige" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="lib/sql-wasm.js"></script>
  <script src="lib/sql-wasm-binaer.js"></script>
  <script src="js/daten.js"></script>
  <script src="js/spickzettel.js"></script>
  <script src="js/editor.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
